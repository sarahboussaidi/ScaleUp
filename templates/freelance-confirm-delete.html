{% extends 'base.html' %}
{% load static %}

{% block title %}Confirmer suppression{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh; background-color: #f5f7fa; padding-top: 50px;">
    <div class="card shadow-lg rounded-4 p-5" style="max-width: 500px; width: 100%; background-color: #ffffff; text-align: center; border-radius: 15px;">
        <!-- Icône d'avertissement -->
        <div class="mb-3">
            <i class="fi-rr-warning" style="font-size: 50px; color: #ff8c42;"></i>
        </div>
        <!-- Titre -->
        <h3 class="fw-bold mb-2">Confirmer la suppression</h3>
        <!-- Description -->
        <p class="text-muted mb-4">
            Voulez-vous vraiment supprimer l'offre suivante ?
        </p>
        <p class="fw-semibold text-primary mb-4">{{ freelance.titre_mission }}</p>

        <!-- Boutons -->
        <form method="POST" class="d-flex justify-content-center gap-3">
            {% csrf_token %}
            <button type="submit" class="btn px-5 py-2 rounded-pill shadow-sm" 
                style="background-color: #7badff; border: none; color: white; transition: all 0.3s;">
                Supprimer
            </button>
            <a href="{% url 'list' %}" class="btn px-5 py-2 rounded-pill shadow-sm" 
                style="background-color: #e0e0e0; border: none; color: #333; transition: all 0.3s;">
                Annuler
            </a>
        </form>
    </div>
</div>

<style>
    /* Hover effects pour les boutons */
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(123, 173, 255, 0.3);
    }

    body {
        padding-top: 80px; /* si header fixe */
        font-family: 'Poppins', sans-serif;
        background-color: #f5f7fa;
    }

    .card p {
        margin: 0;
        
    }

    /* Responsive : centrer correctement sur mobile */
    @media (max-width: 576px) {
        .card {
            padding: 30px 20px;
            
        }
    }
</style>
{% endblock %}
