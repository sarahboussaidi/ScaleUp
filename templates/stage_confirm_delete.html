{% extends 'base.html' %}
{% load static %}

{% block title %}Supprimer le Stage{% endblock %}

{% block content %}
<!-- Pop-up de confirmation -->
<div class="modal show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">⚠️ Confirmation de suppression</h5>
            </div>
            <div class="modal-body">
                <p>Êtes-vous sûr de vouloir supprimer le stage :</p>
                <h6 class="text-brand">{{ stage.titre }}</h6>
                <p class="text-muted mt-2">Cette action est irréversible.</p>
            </div>
            <div class="modal-footer">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
                    <a href="{% url 'stage_list' %}" class="btn btn-secondary">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Style pour le pop-up -->
<style>
.modal.show {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
}
.modal-content {
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
</style>
{% endblock %}
