
{% extends 'base.html' %}
{% load static %}

{% block title %}Connexion{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5">
                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}

                    {% if form.errors %}
                        <div class="alert alert-danger mb-4">
                            <i class="fa fa-exclamation-triangle me-2"></i>
                            <strong>Email ou mot de passe incorrect.</strong> Veuillez réessayer.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">
                            <i class="fa fa-envelope me-2"></i> Adresse e-mail
                        </label>
                        <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                               class="form-control" placeholder="Entrez votre e-mail" required
                               value="{{ form.username.value|default:'' }}">
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">
                            <i class="fa fa-lock me-2"></i> Mot de passe
                        </label>
                        <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                               class="form-control" placeholder="Entrez votre mot de passe" required>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-lg px-5 me-3">
                            <i class="fa fa-sign-in me-2"></i> Se connecter
                        </button>
                    </div>

                    
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
