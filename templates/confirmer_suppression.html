{% extends 'base.html' %}
{% load static %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<!-- SweetAlert2 CSS/JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Content -->
<main class="main">
    <section class="section-box-2">
        <div class="box-head-single none-bg">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8">
                        <div class="card-job hover-up wow animate__animated animate__fadeIn">
                            <div class="card-block-info p-4 text-center">
                                <div class="mb-30">
                                    <img src="{% static 'imgs/theme/icons/alert-circle.svg' %}" alt="Attention" width="80">
                                </div>
                                <h3 class="text-danger mb-20">⚠️ Confirmation de suppression</h3>
                                <p class="text-muted mb-30" style="font-size: 18px;">
                                    Êtes-vous sûr de vouloir <strong>supprimer cette candidature</strong> ?
                                    <br><br>
                                    Cette action est <strong>irréversible</strong>.
                                </p>
                                <form method="POST" class="mt-30" id="deleteForm">
                                    {% csrf_token %}
                                    <div class="d-flex justify-content-center">
                                        <button type="button" class="btn btn-danger me-15" onclick="submitDelete()">
                                            <i class="fi-rr-trash me-1"></i> Oui, supprimer
                                        </button>
                                        <a href="{% url 'liste_candidatures' %}" class="btn btn-border btn-lg">
                                            <i class="fi-rr-angle-left me-1"></i> Annuler
                                        </a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Script pour gérer le pop-up de succès -->
<script>
    function submitDelete() {
        Swal.fire({
            title: 'Suppression en cours...',
            text: 'Veuillez patienter.',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
                document.getElementById('deleteForm').submit();
            }
        });
    }
</script>
{% endblock %}
