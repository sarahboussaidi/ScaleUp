{% extends "base.html" %}
{% load static %}

{% block content %}

    <div class="container">
      <div class="row justify-content-center align-items-center">
        <!-- Login Form -->
        <div class="col-lg-5 col-md-7 col-sm-12" style="width: 450px; " >
          <div class="card shadow-lg rounded-4 p-4 position-relative" style="border-radius: 15px;">
            <div class="text-center mb-4">
              <p class="font-sm text-primary">Welcome Back!</p>
              <h2 class="mb-2 text-dark">Member Login</h2>
              {% if messages %}
                <div class="alert alert-danger">
                  {% for message in messages %}
                    {{ message }}
                  {% endfor %}
                </div>
              {% endif %}
            </div>

            <form action="{% url 'signin' %}" method="POST" class="mt-3">
              {% csrf_token %}
              
              <div class="mb-3">
                <label class="form-label" for="input-1">Email address *</label>
                <input class="form-control form-control-lg" id="input-1" type="email" name="email" placeholder="stevenjob@gmail.com" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="input-4">Password *</label>
                <input class="form-control form-control-lg" id="input-4" type="password" name="password" placeholder="************" required>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label" for="remember">
                    Remember me
                  </label>
                </div>
                <a href="#" class="text-decoration-underline">Forgot Password?</a>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-default btn-brand-hover">Login</button>
              </div>

              <p class="text-center text-muted mb-0">
                Don't have an account? <a href="{% url 'register' %}" class="text-decoration-underline">Sign up</a>
              </p>
            </form>
          </div>
        </div>

        <!-- Decorative Images -->
        <div class="col-lg-5 d-none d-lg-block position-relative">
          <img class="position-absolute top-0 start-0 w-50" src="{% static 'imgs/page/login-register/img-4.svg' %}" alt="JobBox">
          <img class="position-absolute bottom-0 end-0 w-50" src="{% static 'imgs/page/login-register/img-3.svg' %}" alt="JobBox">
        </div>
      </div>
    </div>

{% endblock %}
